<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Iris Bank</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0B0811;
        }
        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: 0;
        }
    </style>
</head>
<body>
    <iframe id="app" allow="clipboard-read; clipboard-write" allowfullscreen></iframe>
    <script>
        (function() {
            var frame = document.getElementById('app');
            frame.src =
                'https://irisbank.vercel.app' +
                (window.location.pathname || '/') +
                (window.location.search || '') +
                (window.location.hash || '');
        })();
    </script>
</body>
</html>
